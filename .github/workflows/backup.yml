# Weekly data dump so a lost free-tier project (paused 90+ days) can be rebuilt: see DEPLOYMENT.md §9.
# Encrypted because this repo is public and enquiries hold personal data. Secrets: SUPABASE_DB_URL, BACKUP_PASSPHRASE.
name: Back up Supabase

on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # public: CMS content + enquiries; auth: the CMS logins. Schema comes from supabase/mitigations, so data only.
      - run: supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --schema public,auth -f data.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: gpg --batch --yes --pinentry-mode loopback --symmetric --passphrase "$BACKUP_PASSPHRASE" -o data.sql.gpg data.sql
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-data
          path: data.sql.gpg
          retention-days: 90
