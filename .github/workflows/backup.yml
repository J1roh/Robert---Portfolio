# Weekly D1 export (CMS content + enquiries) so the database can be rebuilt: see DEPLOYMENT.md §9.
# Encrypted because this repo is public and enquiries hold personal data.
# Secrets: CLOUDFLARE_API_TOKEN (needs D1 read), CLOUDFLARE_ACCOUNT_ID, BACKUP_PASSPHRASE.
# Poster images (Workers KV) are not included.
name: Back up database

on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 export portfolio --remote --output data.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: gpg --batch --yes --pinentry-mode loopback --symmetric --passphrase "$BACKUP_PASSPHRASE" -o data.sql.gpg data.sql
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: d1-data
          path: data.sql.gpg
          retention-days: 90
