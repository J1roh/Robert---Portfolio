# Builds the Vite site and deploys it with the backend (worker/index.ts) to Cloudflare Workers on every push to main.
# One-time setup: repo Settings → Secrets → Actions: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers", plus D1 Edit)
# and CLOUDFLARE_ACCOUNT_ID. Worker secrets (CMS_PASSWORD etc.) live in Cloudflare, not here: see wrangler.jsonc.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
