# Builds the Vite site and publishes dist/ to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions". The Supabase URL and anon key are set below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Environment secrets/variables are only visible to jobs that name the environment.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pages reports where this repo's site lives: '' on a custom domain (jiroh.works), '/<repo>' on <user>.github.io.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/
        # The client's Supabase project. Both values are public (they ship in the site's JS); RLS guards the data.
        env:
          VITE_SUPABASE_URL: https://kadytgyfsfrdzztsqrqv.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZHl0Z3lmc2ZyZHp6dHNxcnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODExMzYsImV4cCI6MjEwNzU1NzEzNn0.Zp0AZGJieMB1bYAP-nrf8xvzYH-JEIWkws_JSHg43Tc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
